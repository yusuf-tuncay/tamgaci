<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sayfa Bulunamadı | Tamgaci</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            color: #1f2937;
            background: #f8fafc;
        }

        .card {
            text-align: center;
            padding: 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 560px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            margin: 0 0 20px;
            color: #6b7280;
        }

        a {
            display: inline-block;
            padding: 10px 16px;
            background: #2563eb;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>404 - Sayfa bulunamadı</h1>
        <p>Aradığınız sayfayı bulamadık. Ana sayfaya dönebilirsiniz.</p>
        <a href="/">Ana sayfaya dön</a>
    </div>
</body>

</html>
