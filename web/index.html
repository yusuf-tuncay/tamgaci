      var originalFetch = window.fetch;
      window.fetch = function (input, init) {
        try {
          var url = (typeof input === 'string') ? input : input.url;
          if (typeof url === 'string') {
            if (url.indexOf('assets/assets/fonts/') !== -1) {
              var fixed = url.replace('assets/assets/fonts/', 'assets/fonts/');
              return originalFetch(fixed, init);
            }
            if (url.endsWith('assets/FontManifest.json')) {
              return originalFetch(url, init).then(function (resp) {
                if (!resp.ok) return resp;
                return resp.clone().text().then(function (txt) {
                  var patched = txt.replace(/\"assets\/fonts\//g, '\"fonts/');
                  return new Response(patched, { headers: resp.headers, status: resp.status, statusText: resp.statusText });
                });
              });
            }
          }
