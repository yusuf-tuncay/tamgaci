  <script>
    // Cache busting script
    const version = '1.0.1+2';
    const timestamp = Date.now();
    
    // Force reload if version changed
    const storedVersion = localStorage.getItem('app_version');
    if (storedVersion !== version) {
      localStorage.setItem('app_version', version);
      localStorage.setItem('last_update', timestamp);
      // Clear all caches
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            caches.delete(name);
          });
        });
      }
    }
    
    // Add version parameter to all asset requests
    const originalFetch = window.fetch;
    window.fetch = function(url, options) {
      if (typeof url === 'string' && (url.includes('.js') || url.includes('.css') || url.includes('.png') || url.includes('.jpg'))) {
        const separator = url.includes('?') ? '&' : '?';
        url = url + separator + 'v=' + version + '&t=' + timestamp;
      }
      return originalFetch(url, options);
    };
  </script>
